<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Enzyme Algae Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #4ade80;
            --success-color: #22c55e;
            --warning-color: #fbbf24;
            --text-color: #f1f5f9;
            --subtle-text: #94a3b8;
            --contaminant-color: #451a03;
            --oxygen-bubble-color: rgba(255, 255, 255, 0.9);
            --algae-color: rgba(74, 222, 128, 0.85);
            --glass-color: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.4);
            --highlight-color: rgba(255, 255, 255, 0.15); 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            /* FIXED VIEWPORT - NO SCROLL */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            height: 100%;
            max-height: 100%;
            background-color: #1e293b;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 1.5vh 20px; /* Responsive vertical padding */
            display: flex;
            flex-direction: column;
        }

        /* Header section takes natural height */
        header {
            flex-shrink: 0;
            margin-bottom: 1vh;
        }

        /* Main Card fills remaining space */
        .card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 10px;
            background-color: #334155;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
            width: 100%;
            flex-grow: 1; /* Expand to fill height */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center canvas vertically */
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            background-color: #0f172a;
            border-radius: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            /* Size set by JS */
        }

        /* Controls section sits at bottom of card or below canvas */
        .controls-area {
            width: 100%;
            flex-shrink: 0; /* Don't squash controls */
            padding-top: 1vh;
            min-height: 100px; /* Reserve space */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #064e3b;
            padding: 10px 24px;
            border-radius: 0.75rem;
            font-weight: 800;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
        }

        .progress-bar-container {
            height: 8px;
            background-color: #475569;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--success-color);
            transition: width 0.5s ease-out;
        }

        .metric-gauge {
            width: 100%;
            height: 6px;
            background-color: #475569;
            border-radius: 3px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            width: 0%;
            background-color: var(--warning-color);
            transition: width 0.5s ease-out;
        }

        /* Custom Scrollbar for any internal overflow elements */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="selection:bg-green-500 selection:text-white">

    <div class="container">
        <header>
            <h1 class="text-xl sm:text-3xl font-extrabold text-center mb-1 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">
                Bio-Enzyme Cleaning Lab
            </h1>
            <p class="text-center text-xs text-subtle-text">Project: Algae-Based Oxygenation & Enzymatic Breakdown</p>
        </header>

        <!-- Main Content Area -->
        <div class="card" id="mainCard">
            <canvas id="experimentCanvas"></canvas>
            
            <!-- Dynamic Controls Container -->
            <div class="controls-area">
                
                <!-- Step 1: Setup -->
                <div id="setupDiv" class="text-center w-full">
                    <div class="flex flex-col justify-center items-center gap-3 mb-3">
                        <div class="w-full max-w-md p-3 bg-slate-800/50 rounded-lg shadow-inner border border-slate-600 flex flex-col sm:flex-row items-center gap-2">
                            <label for="algaeType" class="text-xs sm:text-sm font-medium text-accent-color whitespace-nowrap">Strain:</label>
                            <select id="algaeType" class="w-full p-1.5 rounded bg-slate-700 text-text-color text-sm border border-slate-600 focus:ring-green-500 outline-none">
                                <option value="dormant">Dormant Culture (Control)</option>
                                <option value="active" selected>Activated Green Algae</option>
                                <option value="hyper">Hyper-Enzymatic Strain</option>
                            </select>
                        </div>
                    </div>
                    <button id="startButton" class="btn-primary" onclick="startExperiment()">
                        Activate Bio-Reactor
                    </button>
                </div>

                <!-- Step 2: Running -->
                <div id="runningDiv" class="hidden text-center w-full">
                    <h2 class="text-base font-semibold text-accent-color mb-1">BIO-REACTION IN PROGRESS...</h2>
                    <div class="progress-bar-container mb-2 max-w-md mx-auto">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <p id="phaseStatus" class="text-xs font-mono text-success-color mb-2 h-8 flex items-center justify-center"></p>

                    <div class="flex justify-center gap-4 text-left max-w-2xl mx-auto">
                        <div class="w-1/2 p-2 rounded bg-slate-800/50 border border-slate-600">
                            <span class="text-xs font-bold block text-subtle-text mb-1">Activity</span>
                            <div class="metric-gauge"><div id="metric1Gauge" class="metric-fill"></div></div>
                            <span id="metric1Value" class="text-xs text-warning-color mt-1 block font-mono">0</span>
                        </div>
                        <div class="w-1/2 p-2 rounded bg-slate-800/50 border border-slate-600">
                            <span class="text-xs font-bold block text-subtle-text mb-1">Oxygen</span>
                            <div class="metric-gauge"><div id="metric2Gauge" class="metric-fill"></div></div>
                            <span id="metric2Value" class="text-xs text-warning-color mt-1 block font-mono">0</span>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Results -->
                <div id="resultsDiv" class="hidden text-center w-full">
                    <h2 id="resultTitle" class="text-lg font-bold text-success-color mb-2">EXPERIMENT COMPLETE</h2>
                    <button class="btn-primary" onclick="restartExperiment()">
                        Reset Lab
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- Canvas and DOM Setup ---
        const canvas = document.getElementById('experimentCanvas');
        const ctx = canvas.getContext('2d');
        const mainCard = document.getElementById('mainCard');
        
        const setupDiv = document.getElementById('setupDiv');
        const runningDiv = document.getElementById('runningDiv');
        const resultsDiv = document.getElementById('resultsDiv');
        const resultTitle = document.getElementById('resultTitle');
        const phaseStatus = document.getElementById('phaseStatus');
        const progressBar = document.getElementById('progressBar');
        const algaeSelect = document.getElementById('algaeType');

        const metric1Gauge = document.getElementById('metric1Gauge');
        const metric1Value = document.getElementById('metric1Value');
        const metric2Gauge = document.getElementById('metric2Gauge');
        const metric2Value = document.getElementById('metric2Value');

        // --- Color Constants ---
        const ACCENT_COLOR = '#4ade80';
        const PRIMARY_COLOR = '#0f172a';
        const CONTAMINANT_COLOR = '#451a03';
        const BUBBLE_COLOR = 'rgba(255, 255, 255, 0.95)'; 
        const ALGAE_COLOR = 'rgba(74, 222, 128, 0.9)'; 
        const WATER_COLOR_TOP = 'rgba(255, 255, 255, 0.15)';
        const WATER_COLOR_BOT = 'rgba(255, 255, 255, 0.05)';
        const TEXT_COLOR = '#f1f5f9';
        const GLASS_COLOR = 'rgba(255, 255, 255, 0.05)'; 
        const GLASS_STROKE = 'rgba(255, 255, 255, 0.6)';
        const HIGHLIGHT_COLOR = 'rgba(255, 255, 255, 0.2)';

        // --- Simulation Logic ---
        const experimentPhases = [
            'Phase 1: Algae Photosynthesis...',
            'Phase 2: Oxygen Nucleation...',
            'Phase 3: Bio-Degradation...'
        ];

        const strainConfig = {
            'dormant': { 
                bubbleChance: 0.05, cleaningRate: 0.015, 
                metric1: { width: '15%', text: '45 U/mL' },
                metric2: { width: '20%', text: '1.2 mg/L' },
                avgEfficiency: 15, timeTaken: '45s (Timeout)', oxygenLevel: 'Low', grade: 'D'
            },
            'active': { 
                bubbleChance: 0.5, cleaningRate: 0.15, 
                metric1: { width: '80%', text: '450 U/mL' },
                metric2: { width: '92%', text: '8.4 mg/L' },
                avgEfficiency: 94, timeTaken: '12.4s', oxygenLevel: 'Optimal', grade: 'A'
            },
            'hyper': { 
                bubbleChance: 0.9, cleaningRate: 0.35, 
                metric1: { width: '98%', text: '980 U/mL' },
                metric2: { width: '99%', text: '14.5 mg/L' },
                avgEfficiency: 99, timeTaken: '6.8s', oxygenLevel: 'Extreme', grade: 'A+'
            }
        };

        let currentStrain = 'active'; 
        let bubbles = [];
        let algaeParticles = []; 
        let debrisParticles = []; 
        let contaminantHeight = 60;
        let maxContaminantHeight = 60;
        let animationFrameId = null;
        let simulationRunning = false;
        
        // --- FIT-TO-SCREEN GEOMETRY ---
        let scale = 1;
        const BASE_W = 800;
        const BASE_H = 520;
        
        let beaker = { w: 240, h: 280, x: 400, y: 40, r: 10, rimH: 15 };
        let reactor = { w: 280, h: 120, x: 400, y: 360, r: 20 };
        let tube = { w: 24, h: 40 };

        function updateDimensions() {
            // Get available space inside the card
            // We subtract the height of the controls area (~180px safe buffer)
            const availW = mainCard.clientWidth;
            const availH = mainCard.clientHeight;
            
            // Reserve space for controls (dynamic depending on screen size)
            const uiBuffer = Math.min(180, availH * 0.3); 
            
            const maxCanvasH = Math.max(200, availH - uiBuffer);
            
            // Calculate scales
            const scaleW = availW / BASE_W;
            const scaleH = maxCanvasH / BASE_H;
            
            // Use the smaller scale to ensure it fits in BOTH dimensions
            scale = Math.min(scaleW, scaleH);
            
            canvas.width = BASE_W * scale;
            canvas.height = BASE_H * scale;
            
            const cx = canvas.width / 2;
            
            // Recalculate Geometries
            beaker = { 
                w: 240 * scale, h: 280 * scale, x: cx, y: 40 * scale, 
                r: 10 * scale, rimH: 15 * scale 
            };
            
            reactor = { 
                w: 280 * scale, h: 120 * scale, x: cx, 
                y: (360 * scale) + (20 * scale), r: 20 * scale 
            };
            
            tube = { w: 24 * scale, h: 40 * scale };
            reactor.y = beaker.y + beaker.h + tube.h - (5 * scale);
            
            initAlgae();
        }

        function getFont(size, weight = '') {
            const scaledSize = size * scale;
            const finalSize = Math.max(scaledSize, 10); // Min font size 10px
            return `${weight} ${finalSize}px Inter`;
        }

        // --- Drawing Functions ---
        function drawGlasswarePath() {
            ctx.beginPath();
            const rimOverhang = 10 * scale;
            ctx.moveTo(beaker.x - beaker.w/2 - rimOverhang, beaker.y);
            ctx.lineTo(beaker.x - beaker.w/2, beaker.y + beaker.rimH);
            ctx.lineTo(beaker.x - beaker.w/2, beaker.y + beaker.h - beaker.r);
            ctx.quadraticCurveTo(beaker.x - beaker.w/2, beaker.y + beaker.h, beaker.x - beaker.w/2 + beaker.r, beaker.y + beaker.h);
            ctx.lineTo(beaker.x - tube.w/2, beaker.y + beaker.h);
            ctx.lineTo(beaker.x - tube.w/2, beaker.y + beaker.h + tube.h);
            
            ctx.lineTo(reactor.x - reactor.w/2 + reactor.r, reactor.y);
            ctx.quadraticCurveTo(reactor.x - reactor.w/2, reactor.y, reactor.x - reactor.w/2, reactor.y + reactor.r);
            ctx.lineTo(reactor.x - reactor.w/2, reactor.y + reactor.h - reactor.r);
            ctx.quadraticCurveTo(reactor.x - reactor.w/2, reactor.y + reactor.h, reactor.x - reactor.w/2 + reactor.r, reactor.y + reactor.h);
            ctx.lineTo(reactor.x + reactor.w/2 - reactor.r, reactor.y + reactor.h);
            ctx.quadraticCurveTo(reactor.x + reactor.w/2, reactor.y + reactor.h, reactor.x + reactor.w/2, reactor.y + reactor.h - reactor.r);
            ctx.lineTo(reactor.x + reactor.w/2, reactor.y + reactor.r);
            ctx.quadraticCurveTo(reactor.x + reactor.w/2, reactor.y, reactor.x + reactor.w/2 - reactor.r, reactor.y);
            
            ctx.lineTo(beaker.x + tube.w/2, beaker.y + beaker.h + tube.h);
            ctx.lineTo(beaker.x + tube.w/2, beaker.y + beaker.h);
            
            ctx.lineTo(beaker.x + beaker.w/2 - beaker.r, beaker.y + beaker.h);
            ctx.quadraticCurveTo(beaker.x + beaker.w/2, beaker.y + beaker.h, beaker.x + beaker.w/2, beaker.y + beaker.h - beaker.r);
            ctx.lineTo(beaker.x + beaker.w/2, beaker.y + beaker.rimH);
            ctx.lineTo(beaker.x + beaker.w/2 + rimOverhang + (5*scale), beaker.y - (5*scale)); 
            ctx.lineTo(beaker.x + beaker.w/2 + rimOverhang, beaker.y); 
            ctx.closePath();
        }
        
        function initAlgae() {
            algaeParticles = [];
            const particleCount = 120; 
            for(let i=0; i<particleCount; i++) {
                algaeParticles.push({
                    x: reactor.x - (reactor.w/2 - 20*scale) + Math.random() * (reactor.w - 40*scale),
                    y: reactor.y + 20*scale + Math.random() * (reactor.h - 40*scale),
                    r: (3 + Math.random() * 5) * scale,
                    opacity: 0.3 + Math.random() * 0.6,
                    vx: (Math.random() - 0.5) * 0.5 * scale,
                    vy: (Math.random() - 0.5) * 0.5 * scale,
                    color: Math.random() > 0.7 ? '#86efac' : '#14532d'
                });
            }
        }

        function updateAlgae() {
            const halfW = (reactor.w/2) - (15*scale);
            const halfH = (reactor.h/2) - (15*scale);
            const centerX = reactor.x;
            const centerY = reactor.y + (reactor.h/2);

            for(let p of algaeParticles) {
                p.x += p.vx;
                p.y += p.vy;
                if(p.x < centerX - halfW || p.x > centerX + halfW) p.vx *= -1;
                if(p.y < centerY - halfH || p.y > centerY + halfH) p.vy *= -1;
            }
        }

        function spawnDebris(x, y) {
            const count = 3 + Math.floor(Math.random() * 3);
            for(let i=0; i<count; i++) {
                debrisParticles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 3 * scale,
                    vy: (-Math.random() * 2 - 0.5) * scale,
                    r: (Math.random() * 3 + 1) * scale,
                    opacity: 1.0, decay: 0.01 + Math.random() * 0.02
                });
            }
        }

        function updateDebris() {
            for(let i = debrisParticles.length - 1; i >= 0; i--) {
                let d = debrisParticles[i];
                d.x += d.vx; d.y += d.vy;
                d.opacity -= d.decay; d.vx *= 0.95;
                if(d.opacity <= 0) debrisParticles.splice(i, 1);
            }
        }

        function drawDebris() {
            ctx.fillStyle = CONTAMINANT_COLOR;
            for(let d of debrisParticles) {
                ctx.save(); ctx.globalAlpha = d.opacity;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
                ctx.fill(); ctx.restore();
            }
        }

        function drawAlgae() {
            for(let p of algaeParticles) {
                ctx.save(); ctx.fillStyle = p.color; ctx.globalAlpha = p.opacity;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fill(); ctx.restore();
            }
        }

        function drawGraduations() {
            ctx.fillStyle = GLASS_STROKE;
            ctx.textAlign = 'right';
            ctx.font = getFont(10);
            const startY = beaker.y + beaker.h - (30 * scale); 
            const endY = beaker.y + (40 * scale); 
            const steps = 5;
            const stepSize = (startY - endY) / steps;

            for(let i = 0; i <= steps; i++) {
                const lineY = startY - (i * stepSize);
                const vol = 100 + (i * 100); 
                ctx.globalAlpha = 0.6;
                ctx.fillRect(beaker.x + beaker.w/2 - (25 * scale), lineY, 15 * scale, 2 * scale); 
                ctx.fillText(vol + 'ml', beaker.x + beaker.w/2 - (30 * scale), lineY + (3 * scale));
                ctx.globalAlpha = 1.0;
            }
        }

        function drawScene() {
            ctx.fillStyle = PRIMARY_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Liquids
            ctx.save();
            drawGlasswarePath();
            ctx.clip();

            const reactorGrad = ctx.createLinearGradient(0, reactor.y, 0, reactor.y + reactor.h);
            reactorGrad.addColorStop(0, 'rgba(74, 222, 128, 0.8)'); 
            reactorGrad.addColorStop(1, 'rgba(20, 83, 45, 0.9)'); 
            ctx.fillStyle = reactorGrad;
            ctx.fillRect(reactor.x - reactor.w/2, reactor.y, reactor.w, reactor.h);
            
            drawAlgae();
            
            ctx.fillStyle = ALGAE_COLOR;
            ctx.fillRect(beaker.x - tube.w/2, beaker.y + beaker.h, tube.w, tube.h);

            // Water & Contaminant
            const pollutionRatio = contaminantHeight / maxContaminantHeight;
            const r = Math.round(200 - (100 * pollutionRatio));
            const g = Math.round(240 - (160 * pollutionRatio));
            const b = Math.round(255 - (195 * pollutionRatio));
            const a = 0.15 + (0.45 * pollutionRatio);
            
            const dynamicWaterColor = `rgba(${r}, ${g}, ${b}, ${a})`;
            const waterGradient = ctx.createLinearGradient(0, beaker.y + beaker.h, 0, beaker.y);
            waterGradient.addColorStop(0, dynamicWaterColor);
            waterGradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${a*0.5})`);
            
            ctx.fillStyle = waterGradient;
            ctx.fillRect(beaker.x - beaker.w/2, beaker.y, beaker.w, beaker.h);

            const currentContamH = contaminantHeight * scale; 
            ctx.fillStyle = CONTAMINANT_COLOR;
            const contaminantY = beaker.y + beaker.h - currentContamH;
            ctx.fillRect(beaker.x - beaker.w/2, contaminantY, beaker.w, currentContamH);

            drawDebris(); 
            drawBubbles();
            ctx.restore();

            // Glass & Highlights
            ctx.lineWidth = 4 * scale;
            ctx.strokeStyle = GLASS_STROKE;
            ctx.fillStyle = GLASS_COLOR;
            drawGlasswarePath();
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(beaker.x - beaker.w/2 + 15*scale, beaker.y + 30*scale);
            ctx.lineTo(beaker.x - beaker.w/2 + 15*scale, beaker.y + beaker.h - 20*scale);
            ctx.lineWidth = 3 * scale;
            ctx.strokeStyle = HIGHLIGHT_COLOR;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(reactor.x - reactor.w/2 + 20*scale, reactor.y + 20*scale);
            ctx.arc(reactor.x - reactor.w/2 + 20*scale, reactor.y + 20*scale, 10*scale, Math.PI, 1.5 * Math.PI);
            ctx.stroke();
            ctx.restore();

            drawGraduations();

            ctx.fillStyle = TEXT_COLOR;
            ctx.textAlign = 'center';
            ctx.font = getFont(14);
            ctx.fillText('Standard Griffin Beaker', beaker.x, beaker.y - 15*scale);
            ctx.fillStyle = ACCENT_COLOR;
            ctx.fillText('Algae Culture Tank', reactor.x, reactor.y + reactor.h + 25*scale);
        }

        function createBubble() {
            const startInReactor = Math.random() > 0.1; 
            let x, y;
            if (startInReactor) {
                x = reactor.x - (reactor.w/2 - 20*scale) + Math.random() * (reactor.w - 40*scale);
                y = reactor.y + reactor.h - 10*scale;
            } else {
                x = beaker.x;
                y = beaker.y + beaker.h + tube.h;
            }
            return {
                x: x, y: y,
                radius: (2 + Math.random() * 4) * scale,
                speed: (2 + Math.random() * 2.5) * scale, 
                bursting: false, burstTimer: 0
            };
        }

        function updateBubbles() {
            const cleaningSurfaceY = beaker.y + beaker.h - (contaminantHeight * scale);
            const tubeLeft = beaker.x - tube.w/2;
            const tubeRight = beaker.x + tube.w/2;
            const cleaningRate = strainConfig[currentStrain].cleaningRate; 

            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.y -= b.speed;

                if (b.y > beaker.y + beaker.h + tube.h) {
                    if (b.x < tubeLeft + 2*scale || b.x > tubeRight - 2*scale) {
                        if (b.y < reactor.y + 5*scale) {
                            b.y = reactor.y + 5*scale; 
                            if (b.x < beaker.x) b.x += 1.5*scale; else b.x -= 1.5*scale;
                        }
                    }
                }
                
                if (b.y < beaker.y + beaker.h) {
                    if (b.y <= cleaningSurfaceY && b.y > cleaningSurfaceY - 10*scale && !b.bursting) {
                        b.bursting = true;
                        b.burstTimer = 8;
                        contaminantHeight = Math.max(5, contaminantHeight - cleaningRate); 
                        spawnDebris(b.x, b.y);
                    }
                }

                if (b.bursting) {
                    b.burstTimer--;
                    if (b.burstTimer <= 0) bubbles.splice(i, 1);
                } 
                else if (b.y < beaker.y) {
                    bubbles.splice(i, 1);
                }
            }
            updateDebris();
        }

        function drawBubbles() {
            for (const b of bubbles) {
                if (b.bursting) {
                    ctx.fillStyle = `rgba(255, 255, 200, ${b.burstTimer / 8})`;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = BUBBLE_COLOR;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // --- Flow Control ---
        function startExperiment() {
            currentStrain = algaeSelect.value;
            setupDiv.classList.add('hidden');
            resultsDiv.classList.add('hidden');
            runningDiv.classList.remove('hidden');

            simulationRunning = true;
            contaminantHeight = 60; 
            bubbles = [];
            debrisParticles = []; 
            initAlgae(); 
            
            let phaseIndex = 0;
            const totalDuration = 12000; 
            const phaseInterval = totalDuration / experimentPhases.length;

            animate();

            const phaseTimer = setInterval(() => {
                if (phaseIndex < experimentPhases.length) {
                    phaseStatus.innerHTML = experimentPhases[phaseIndex];
                    progressBar.style.width = `${((phaseIndex + 1) / experimentPhases.length) * 100}%`;
                    
                    const config = strainConfig[currentStrain];
                    if (phaseIndex === 0) {
                        metric1Gauge.style.width = config.metric1.width;
                        metric1Value.textContent = config.metric1.text;
                    } else if (phaseIndex === 1) {
                        metric2Gauge.style.width = config.metric2.width;
                        metric2Value.textContent = config.metric2.text;
                    }
                    phaseIndex++;
                } else {
                    clearInterval(phaseTimer);
                }
            }, phaseInterval);

            setTimeout(() => {
                simulationRunning = false;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                runningDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                drawResults();
            }, totalDuration);
        }

        function animate() {
            if (!simulationRunning) return;
            const chance = strainConfig[currentStrain].bubbleChance;
            if (Math.random() < chance) { 
                 bubbles.push(createBubble());
                 if(currentStrain === 'hyper') bubbles.push(createBubble());
            }
            updateBubbles();
            updateAlgae(); 
            drawScene();
            animationFrameId = requestAnimationFrame(animate);
        }
        
        function restartExperiment() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            bubbles = [];
            debrisParticles = [];
            contaminantHeight = 60;
            simulationRunning = false;
            updateDimensions(); 
            
            setupDiv.classList.remove('hidden');
            runningDiv.classList.add('hidden');
            resultsDiv.classList.add('hidden');
            
            progressBar.style.width = '0%';
            metric1Gauge.style.width = '0%';
            metric1Value.textContent = '0 U/mL';
            metric2Gauge.style.width = '0%';
            metric2Value.textContent = '0 mg/L';
            
            drawScene();
        }
        
        function drawResults() {
             ctx.fillStyle = PRIMARY_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const config = strainConfig[currentStrain];
            const efficiency = config.avgEfficiency; 
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Card Scales with Canvas
            const isCompact = canvas.width < 500 * scale;
            const cardW = Math.min(580 * scale, canvas.width * 0.9);
            const cardH = isCompact ? 400 * scale : 300 * scale;
            
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = GLASS_STROKE;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(centerX - cardW/2, centerY - cardH/2, cardW, cardH, 20 * scale);
            ctx.fill();
            ctx.stroke();
            
            if (isCompact) {
                const gaugeY = centerY - cardH/4; 
                const radius = 60 * scale; 
                drawGauge(centerX, gaugeY, radius, efficiency);
                const statsY = centerY + 20 * scale; 
                drawStatsText(centerX, statsY, config, true); 
            } else {
                const gaugeX = centerX - (cardW * 0.25); 
                const radius = 75 * scale;
                drawGauge(gaugeX, centerY - 15*scale, radius, efficiency);
                const statsX = centerX + (20 * scale);
                const statsY = centerY - (60 * scale);
                drawStatsText(statsX, statsY, config, false);
            }

            ctx.font = getFont(12, 'italic');
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'center';
            ctx.fillText("Data generated from single-run simulation parameters.", centerX, centerY + cardH/2 + (25 * scale));
        }
        
        function drawGauge(x, y, r, efficiency) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 12 * scale; 
            ctx.stroke();
            
            const startAngle = -Math.PI / 2;
            const endAngle = startAngle + (Math.PI * 2 * (efficiency / 100));
            ctx.beginPath();
            ctx.arc(x, y, r, startAngle, endAngle);
            ctx.strokeStyle = ACCENT_COLOR;
            ctx.lineWidth = 12 * scale;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            ctx.fillStyle = TEXT_COLOR;
            ctx.font = getFont(42, 'bold'); 
            ctx.textAlign = 'center';
            ctx.fillText(`${efficiency}%`, x, y + (15*scale)); 
            
            ctx.font = getFont(14);
            ctx.fillStyle = '#94a3b8';
            ctx.fillText("Contaminant Removed", x, y + r + (30*scale));
        }
        
        function drawStatsText(x, y, config, centerAlign) {
            ctx.textAlign = centerAlign ? 'center' : 'left';
            const valOffset = 150 * scale;
            
            ctx.font = getFont(20, 'bold');
            ctx.fillStyle = ACCENT_COLOR;
            ctx.fillText(currentStrain.toUpperCase() + " REPORT", x, y);
            
            ctx.fillStyle = '#334155';
            const divW = 240 * scale;
            if(centerAlign) ctx.fillRect(x - divW/2, y + 10*scale, divW, 2);
            else ctx.fillRect(x, y + 10*scale, divW, 2);
            
            const row1Y = y + 40*scale;
            const row2Y = y + 70*scale;
            const row3Y = y + 100*scale;
            
            if (centerAlign) {
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText(`Time: ${config.timeTaken} | Oxygen: ${config.oxygenLevel}`, x, row1Y);
                ctx.fillText("Bio-Efficiency Grade:", x, row2Y);
                const grade = config.grade;
                let gradeColor = ACCENT_COLOR;
                if(grade === 'C' || grade === 'D') gradeColor = '#fbbf24'; 
                ctx.font = getFont(28, 'bold'); ctx.fillStyle = gradeColor;
                ctx.fillText(grade, x, row3Y + 5*scale);
            } else {
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText("Processing Time:", x, row1Y);
                ctx.font = getFont(16, 'bold'); ctx.fillStyle = TEXT_COLOR;
                ctx.fillText(config.timeTaken, x + valOffset, row1Y);
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText("Oxygen Saturation:", x, row2Y);
                ctx.font = getFont(16, 'bold'); ctx.fillStyle = TEXT_COLOR;
                ctx.fillText(config.oxygenLevel, x + valOffset, row2Y);
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText("Bio-Efficiency Grade:", x, row3Y);
                const grade = config.grade;
                let gradeColor = ACCENT_COLOR;
                if(grade === 'C' || grade === 'D') gradeColor = '#fbbf24'; 
                ctx.font = getFont(28, 'bold'); ctx.fillStyle = gradeColor;
                ctx.fillText(grade, x + valOffset + (20*scale), row3Y + 5*scale);
            }
        }

        window.addEventListener('resize', () => {
            updateDimensions();
            if(!simulationRunning) drawScene();
            if(resultsDiv.classList.contains('hidden') === false) drawResults();
        });
        
        window.onload = () => {
            updateDimensions();
            restartExperiment();
        };
    </script>
</body>
</html>
