<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Enzyme Algae Lab + Nanobubbles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #4ade80;
            --success-color: #22c55e;
            --warning-color: #fbbf24;
            --text-color: #f1f5f9;
            --subtle-text: #94a3b8;
            --contaminant-color: #451a03;
            --oxygen-bubble-color: rgba(255, 255, 255, 0.9);
            --nano-bubble-color: rgba(180, 255, 255, 1.0);
            --algae-color: rgba(74, 222, 128, 0.85);
            --glass-color: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.4);
            --highlight-color: rgba(255, 255, 255, 0.15); 
            --uv-color: rgba(168, 85, 247, 0.6);
            --uv-glow: rgba(192, 132, 252, 0.9);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            height: 100%;
            max-height: 100%;
            background-color: #1e293b;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 1.5vh 20px; 
            display: flex;
            flex-direction: column;
        }

        header {
            flex-shrink: 0;
            margin-bottom: 1vh;
        }

        .card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 10px;
            background-color: #334155;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
            width: 100%;
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            background-color: #0f172a;
            border-radius: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .controls-area {
            width: 100%;
            flex-shrink: 0; 
            padding-top: 1vh;
            min-height: 100px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #064e3b;
            padding: 10px 24px;
            border-radius: 0.75rem;
            font-weight: 800;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
        }

        /* Pump Button Styles */
        .btn-pump {
            background-color: #334155;
            color: #94a3b8;
            border: 2px solid #475569;
            padding: 10px 20px;
            border-radius: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pump.active {
            background-color: #06b6d4; /* Cyan */
            color: #0f172a;
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
        }

        .btn-pump:hover:not(.active) {
            border-color: #94a3b8;
            color: white;
        }

        .led-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444; /* Red off */
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
        }

        .btn-pump.active .led-indicator {
            background-color: #ccfbf1; /* Bright Cyan/White */
            box-shadow: 0 0 8px #22d3ee;
        }

        .progress-bar-container {
            height: 8px;
            background-color: #475569;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--success-color);
            transition: width 0.5s ease-out;
        }

        .metric-gauge {
            width: 100%;
            height: 6px;
            background-color: #475569;
            border-radius: 3px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            width: 0%;
            background-color: var(--warning-color);
            transition: width 0.5s ease-out;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="selection:bg-green-500 selection:text-white">

    <div class="container">
        <header>
            <h1 class="text-xl sm:text-3xl font-extrabold text-center mb-1 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">
                Bio-Enzyme Cleaning Lab
            </h1>
            <p class="text-center text-xs text-subtle-text">Project: Algae-Based Oxygenation & Nanobubble Injection</p>
        </header>

        <div class="card" id="mainCard">
            <canvas id="experimentCanvas"></canvas>
            
            <div class="controls-area">
                <div id="setupDiv" class="text-center w-full">
                    <div class="flex flex-col justify-center items-center gap-3 mb-3">
                        <div class="w-full max-w-md p-3 bg-slate-800/50 rounded-lg shadow-inner border border-slate-600 flex flex-col sm:flex-row items-center gap-2">
                            <label for="algaeType" class="text-xs sm:text-sm font-medium text-accent-color whitespace-nowrap">Strain & Tech:</label>
                            <select id="algaeType" class="w-full p-1.5 rounded bg-slate-700 text-text-color text-sm border border-slate-600 focus:ring-green-500 outline-none">
                                <option value="dormant">Dormant Culture (No Aeration)</option>
                                <option value="active" selected>Active Algae + Microbubbles</option>
                                <option value="hyper">Hyper-Enzymatic + Nanobubbles</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-center gap-3">
                        <button id="startButton" class="btn-primary" onclick="startExperiment()">
                            Activate Bio-Reactor
                        </button>
                    </div>
                </div>

                <div id="runningDiv" class="hidden text-center w-full">
                    <div class="flex justify-between items-center mb-2 px-4">
                        <h2 class="text-base font-semibold text-accent-color">BIO-REACTION IN PROGRESS...</h2>
                        <!-- Pump Button Hidden by Default -->
                        <button id="nanoPumpBtn" class="hidden btn-pump" onclick="togglePump()">
                            <div class="led-indicator"></div>
                            ACTIVATE PUMP
                        </button>
                    </div>
                    
                    <div class="progress-bar-container mb-2 max-w-md mx-auto">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <p id="phaseStatus" class="text-xs font-mono text-success-color mb-2 h-8 flex items-center justify-center"></p>

                    <div class="flex justify-center gap-4 text-left max-w-2xl mx-auto">
                        <div class="w-1/2 p-2 rounded bg-slate-800/50 border border-slate-600">
                            <span class="text-xs font-bold block text-subtle-text mb-1">Enzyme Activity</span>
                            <div class="metric-gauge"><div id="metric1Gauge" class="metric-fill"></div></div>
                            <span id="metric1Value" class="text-xs text-warning-color mt-1 block font-mono">0</span>
                        </div>
                        <div class="w-1/2 p-2 rounded bg-slate-800/50 border border-slate-600">
                            <span class="text-xs font-bold block text-subtle-text mb-1">Dissolved Oxygen</span>
                            <div class="metric-gauge"><div id="metric2Gauge" class="metric-fill"></div></div>
                            <span id="metric2Value" class="text-xs text-warning-color mt-1 block font-mono">0</span>
                        </div>
                    </div>
                </div>

                <div id="resultsDiv" class="hidden text-center w-full">
                    <h2 id="resultTitle" class="text-lg font-bold text-success-color mb-2">EXPERIMENT COMPLETE</h2>
                    <button class="btn-primary" onclick="restartExperiment()">
                        Reset Lab
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('experimentCanvas');
        const ctx = canvas.getContext('2d');
        const mainCard = document.getElementById('mainCard');
        
        const setupDiv = document.getElementById('setupDiv');
        const runningDiv = document.getElementById('runningDiv');
        const resultsDiv = document.getElementById('resultsDiv');
        const phaseStatus = document.getElementById('phaseStatus');
        const progressBar = document.getElementById('progressBar');
        const algaeSelect = document.getElementById('algaeType');
        const nanoPumpBtn = document.getElementById('nanoPumpBtn');

        const metric1Gauge = document.getElementById('metric1Gauge');
        const metric1Value = document.getElementById('metric1Value');
        const metric2Gauge = document.getElementById('metric2Gauge');
        const metric2Value = document.getElementById('metric2Value');

        const ACCENT_COLOR = '#4ade80';
        const PRIMARY_COLOR = '#0f172a';
        const CONTAMINANT_COLOR = '#451a03';
        const BUBBLE_COLOR = 'rgba(255, 255, 255, 0.95)'; 
        const NANO_BUBBLE_COLOR = 'rgba(180, 255, 255, 1.0)'; 
        const ALGAE_COLOR = 'rgba(74, 222, 128, 0.9)'; 
        const TEXT_COLOR = '#f1f5f9';
        const GLASS_COLOR = 'rgba(255, 255, 255, 0.05)'; 
        const GLASS_STROKE = 'rgba(255, 255, 255, 0.6)';
        const HIGHLIGHT_COLOR = 'rgba(255, 255, 255, 0.15);';
        const UV_BEAM = 'rgba(168, 85, 247, 0.4)'; 
        const UV_DIODE_ON = '#d8b4fe';
        const UV_DIODE_OFF = '#475569';
        const UV_SHIELD = '#1e293b';

        const experimentPhases = [
            'Phase 1: Reactor Activation...',
            'Phase 2: Injection Protocol...',
            'Phase 3: Enzymatic Breakdown + UV...'
        ];

        // REBALANCED CONFIGURATION FOR REALISTIC TIMING
        const strainConfig = {
            'dormant': { 
                bubbleChance: 0.05, nanoChance: 0, cleaningRate: 0.015, 
                metric1: { width: '15%', text: '45 U/mL' },
                metric2: { width: '20%', text: '1.2 mg/L' },
                avgEfficiency: 15, timeTaken: '45s (Timeout)', oxygenLevel: 'Low', grade: 'D',
                uvImpact: 'Blocked' 
            },
            'active': { 
                bubbleChance: 0.75, nanoChance: 0, cleaningRate: 0.08, 
                metric1: { width: '80%', text: '450 U/mL' },
                metric2: { width: '85%', text: '7.4 mg/L' },
                avgEfficiency: 92, timeTaken: '12.4s', oxygenLevel: 'High', grade: 'A',
                uvImpact: '99.9% Sterilized'
            },
            'hyper': { 
                bubbleChance: 0.9, nanoChance: 1.0, cleaningRate: 0.04, 
                metric1: { width: '98%', text: '980 U/mL' },
                metric2: { width: '99%', text: '18.5 mg/L (Supersaturated)' },
                avgEfficiency: 99.9, timeTaken: '6.8s', oxygenLevel: 'Extreme', grade: 'A+',
                uvImpact: 'Explosive Cavitation' // Updated specific terminology
            }
        };

        let currentStrain = 'active'; 
        let bubbles = [];
        let nanoBubbles = []; 
        let nanoBursts = []; 
        let algaeParticles = []; 
        let debrisParticles = []; 
        let contaminantHeight = 60;
        let animationFrameId = null;
        let simulationRunning = false;
        let pumpActive = false;
        let pumpVibrationOffset = 0;
        
        let scale = 1;
        const BASE_W = 800;
        const BASE_H = 520;
        
        let beaker = { w: 240, h: 260, x: 400, y: 40, r: 10, rimH: 15 };
        let bioTank = { w: 120, h: 100, x: 0, y: 0, r: 25 };
        let nanoTank = { w: 120, h: 100, x: 0, y: 0, r: 25 };
        let tubeLeft = { w: 24, h: 60, x: 0 };
        let tubeRight = { w: 24, h: 60, x: 0 };
        let pumpUnit = { x: 0, y: 0, w: 40, h: 40 };

        function updateDimensions() {
            const availW = mainCard.clientWidth;
            const availH = mainCard.clientHeight;
            const uiBuffer = Math.min(180, availH * 0.3); 
            const maxCanvasH = Math.max(200, availH - uiBuffer);
            const scaleW = availW / BASE_W;
            const scaleH = maxCanvasH / BASE_H;
            scale = Math.min(scaleW, scaleH);
            
            canvas.width = BASE_W * scale;
            canvas.height = BASE_H * scale;
            const cx = canvas.width / 2;
            
            beaker = { w: 240 * scale, h: 260 * scale, x: cx, y: 40 * scale, r: 10 * scale, rimH: 15 * scale };
            
            const isDual = currentStrain === 'hyper';
            const tankY = beaker.y + beaker.h + (60 * scale) + (10 * scale); // 60 is standard tube height

            if (isDual) {
                // Dual Tank Configuration
                const tubeOffset = 60 * scale;
                tubeLeft = { w: 24 * scale, h: 60 * scale, x: cx - tubeOffset };
                tubeRight = { w: 24 * scale, h: 60 * scale, x: cx + tubeOffset };
                
                bioTank = { w: 130 * scale, h: 100 * scale, x: tubeLeft.x, y: tankY, r: 25 * scale };
                nanoTank = { w: 130 * scale, h: 100 * scale, x: tubeRight.x, y: tankY, r: 25 * scale };
                
                // Pump relative to Nano Tank
                pumpUnit = {
                    x: nanoTank.x + nanoTank.w/2 + 20 * scale,
                    y: nanoTank.y + nanoTank.h/2 - 20 * scale,
                    w: 50 * scale,
                    h: 40 * scale
                };
            } else {
                // Single Large Tank Configuration
                tubeLeft = { w: 40 * scale, h: 60 * scale, x: cx }; // Central, wider tube
                // tubeRight not used
                tubeRight = { w: 0, h: 0, x: 0 };
                
                // Large centralized BioTank
                bioTank = { w: 280 * scale, h: 130 * scale, x: cx, y: tankY + (15*scale), r: 30 * scale };
                
                // Dummy nano tank values
                nanoTank = { w: 0, h: 0, x: 0, y: 0, r: 0 };
            }
            
            initAlgae();
        }

        function getFont(size, weight = '') {
            return `${weight} ${Math.max(size * scale, 10)}px Inter`;
        }

        // Draw mechanical pump connected to the tank
        function drawPump() {
            // Vibration effect
            const shakeX = pumpActive ? (Math.random() - 0.5) * 2 * scale : 0;
            const shakeY = pumpActive ? (Math.random() - 0.5) * 2 * scale : 0;
            
            const px = pumpUnit.x + shakeX;
            const py = pumpUnit.y + shakeY;
            const pw = pumpUnit.w;
            const ph = pumpUnit.h;

            // Connection Pipe
            ctx.fillStyle = '#475569';
            ctx.fillRect(nanoTank.x + nanoTank.w/2, py + ph/2 - 5*scale, px - (nanoTank.x + nanoTank.w/2), 10*scale);

            // Pump Body Main
            ctx.fillStyle = '#1e293b'; // Dark blue/slate
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2 * scale;
            
            ctx.beginPath();
            ctx.roundRect(px, py, pw, ph, 5*scale);
            ctx.fill();
            ctx.stroke();

            // Pump Detail - Fan/Turbine
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(px + pw/2, py + ph/2, ph/2 - 5*scale, 0, Math.PI*2);
            ctx.fill();

            // Animated Fan Blades
            if (pumpActive) {
                pumpVibrationOffset += 0.5; // Rotate
            }
            ctx.save();
            ctx.translate(px + pw/2, py + ph/2);
            ctx.rotate(pumpVibrationOffset);
            ctx.fillStyle = pumpActive ? '#22d3ee' : '#64748b'; // Cyan if active
            for(let i=0; i<3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, ph/2 - 8*scale, 0, Math.PI/3);
                ctx.fill();
                ctx.rotate((Math.PI*2)/3);
            }
            ctx.restore();

            // Status Light
            const lightColor = pumpActive ? '#22d3ee' : '#ef4444';
            ctx.fillStyle = lightColor;
            ctx.shadowColor = lightColor;
            ctx.shadowBlur = pumpActive ? 10 : 0;
            ctx.beginPath();
            ctx.arc(px + pw - 8*scale, py + 8*scale, 3*scale, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Draw glassware including optional dual tank setup
        function drawGlasswarePath(isDual) {
            ctx.beginPath();
            const rimOverhang = 10 * scale;
            ctx.moveTo(beaker.x - beaker.w/2 - rimOverhang, beaker.y);
            ctx.lineTo(beaker.x - beaker.w/2, beaker.y + beaker.rimH);
            ctx.lineTo(beaker.x - beaker.w/2, beaker.y + beaker.h - beaker.r);
            ctx.quadraticCurveTo(beaker.x - beaker.w/2, beaker.y + beaker.h, beaker.x - beaker.w/2 + beaker.r, beaker.y + beaker.h);
            
            // Left Side / Bio Tank (Standard Path)
            ctx.lineTo(tubeLeft.x - tubeLeft.w/2, beaker.y + beaker.h);
            ctx.lineTo(tubeLeft.x - tubeLeft.w/2, beaker.y + beaker.h + tubeLeft.h);
            ctx.lineTo(bioTank.x - bioTank.w/2 + bioTank.r, bioTank.y);
            ctx.quadraticCurveTo(bioTank.x - bioTank.w/2, bioTank.y, bioTank.x - bioTank.w/2, bioTank.y + bioTank.r);
            ctx.lineTo(bioTank.x - bioTank.w/2, bioTank.y + bioTank.h - bioTank.r);
            ctx.quadraticCurveTo(bioTank.x - bioTank.w/2, bioTank.y + bioTank.h, bioTank.x - bioTank.w/2 + bioTank.r, bioTank.y + bioTank.h);
            ctx.lineTo(bioTank.x + bioTank.w/2 - bioTank.r, bioTank.y + bioTank.h);
            ctx.quadraticCurveTo(bioTank.x + bioTank.w/2, bioTank.y + bioTank.h, bioTank.x + bioTank.w/2, bioTank.y + bioTank.h - bioTank.r);
            ctx.lineTo(bioTank.x + bioTank.w/2, bioTank.y + bioTank.r);
            ctx.quadraticCurveTo(bioTank.x + bioTank.w/2, bioTank.y, bioTank.x + bioTank.w/2 - bioTank.r, bioTank.y);
            ctx.lineTo(tubeLeft.x + tubeLeft.w/2, beaker.y + beaker.h + tubeLeft.h);
            ctx.lineTo(tubeLeft.x + tubeLeft.w/2, beaker.y + beaker.h);

            if (isDual) {
                // Right Side / Nano Tank (Only if Dual)
                ctx.lineTo(tubeRight.x - tubeRight.w/2, beaker.y + beaker.h);
                ctx.lineTo(tubeRight.x - tubeRight.w/2, beaker.y + beaker.h + tubeRight.h);
                ctx.lineTo(nanoTank.x - nanoTank.w/2 + nanoTank.r, nanoTank.y);
                ctx.quadraticCurveTo(nanoTank.x - nanoTank.w/2, nanoTank.y, nanoTank.x - nanoTank.w/2, nanoTank.y + nanoTank.r);
                ctx.lineTo(nanoTank.x - nanoTank.w/2, nanoTank.y + nanoTank.h - nanoTank.r);
                ctx.quadraticCurveTo(nanoTank.x - nanoTank.w/2, nanoTank.y + nanoTank.h, nanoTank.x - nanoTank.w/2 + nanoTank.r, nanoTank.y + nanoTank.h);
                ctx.lineTo(nanoTank.x + nanoTank.w/2 - nanoTank.r, nanoTank.y + nanoTank.h);
                ctx.quadraticCurveTo(nanoTank.x + nanoTank.w/2, nanoTank.y + nanoTank.h, nanoTank.x + nanoTank.w/2, nanoTank.y + nanoTank.h - nanoTank.r);
                ctx.lineTo(nanoTank.x + nanoTank.w/2, nanoTank.y + nanoTank.r);
                ctx.quadraticCurveTo(nanoTank.x + nanoTank.w/2, nanoTank.y, nanoTank.x + nanoTank.w/2 - nanoTank.r, nanoTank.y);
                ctx.lineTo(tubeRight.x + tubeRight.w/2, beaker.y + beaker.h + tubeRight.h);
                ctx.lineTo(tubeRight.x + tubeRight.w/2, beaker.y + beaker.h);
            } else {
                // Close bottom of beaker if Single Tank - Line to the right corner
                ctx.lineTo(beaker.x + beaker.w/2 - beaker.r, beaker.y + beaker.h);
            }

            ctx.lineTo(beaker.x + beaker.w/2 - beaker.r, beaker.y + beaker.h);
            ctx.quadraticCurveTo(beaker.x + beaker.w/2, beaker.y + beaker.h, beaker.x + beaker.w/2, beaker.y + beaker.h - beaker.r);
            ctx.lineTo(beaker.x + beaker.w/2, beaker.y + beaker.rimH);
            ctx.lineTo(beaker.x + beaker.w/2 + rimOverhang + (5*scale), beaker.y - (5*scale)); 
            ctx.lineTo(beaker.x + beaker.w/2 + rimOverhang, beaker.y); 
            ctx.closePath();
        }
        
        function initAlgae() {
            algaeParticles = [];
            const particleCount = 100; 
            for(let i=0; i<particleCount; i++) {
                algaeParticles.push({
                    x: bioTank.x - (bioTank.w/2 - 10*scale) + Math.random() * (bioTank.w - 20*scale),
                    y: bioTank.y + 10*scale + Math.random() * (bioTank.h - 20*scale),
                    r: (3 + Math.random() * 5) * scale,
                    opacity: 0.3 + Math.random() * 0.6,
                    vx: (Math.random() - 0.5) * 0.5 * scale,
                    vy: (Math.random() - 0.5) * 0.5 * scale,
                    color: Math.random() > 0.7 ? '#86efac' : '#14532d'
                });
            }
        }

        function updateAlgae() {
            const halfW = (bioTank.w/2) - (10*scale);
            const halfH = (bioTank.h/2) - (10*scale);
            const centerX = bioTank.x;
            const centerY = bioTank.y + (bioTank.h/2);
            for(let p of algaeParticles) {
                p.x += p.vx; p.y += p.vy;
                if(p.x < centerX - halfW || p.x > centerX + halfW) p.vx *= -1;
                if(p.y < centerY - halfH || p.y > centerY + halfH) p.vy *= -1;
            }
        }

        function spawnDebris(x, y) {
            const count = 3 + Math.floor(Math.random() * 3);
            for(let i=0; i<count; i++) {
                debrisParticles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 3 * scale,
                    vy: (-Math.random() * 2 - 0.5) * scale,
                    r: (Math.random() * 3 + 1) * scale,
                    opacity: 1.0, decay: 0.01 + Math.random() * 0.02,
                    isZapped: false
                });
            }
        }

        function createNanoBurst(x, y) {
            nanoBursts.push({
                x: x, y: y,
                radius: 1 * scale,
                maxRadius: (10 + Math.random() * 5) * scale,
                opacity: 1.0,
                color: '#e879f9'
            });
        }

        function updateNanoBursts() {
            for (let i = nanoBursts.length - 1; i >= 0; i--) {
                const burst = nanoBursts[i];
                burst.radius += 0.8 * scale;
                burst.opacity -= 0.08;
                if(burst.opacity <= 0) nanoBursts.splice(i, 1);
            }
        }

        function drawNanoBursts() {
             for (const burst of nanoBursts) {
                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = `rgba(232, 121, 249, ${burst.opacity})`;
                ctx.lineWidth = 2 * scale;
                ctx.arc(burst.x, burst.y, burst.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function spawnMicroDebris(x, y) {
            const count = 5 + Math.floor(Math.random() * 5); 
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (2.0 + Math.random() * 3.0) * scale;
                debrisParticles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    r: (Math.random() * 2.5 + 1.0) * scale, 
                    opacity: 1.0, 
                    decay: 0.05 + Math.random() * 0.03, 
                    isZapped: true 
                });
            }
            createNanoBurst(x, y);
        }

        function updateDebris() {
            const extraDecay = simulationRunning ? 0.02 : 0; 
            for(let i = debrisParticles.length - 1; i >= 0; i--) {
                let d = debrisParticles[i];
                d.x += d.vx; d.y += d.vy;
                d.opacity -= (d.decay + extraDecay); 
                d.vx *= 0.90; 
                if(simulationRunning) d.isZapped = true; 
                if(d.opacity <= 0) debrisParticles.splice(i, 1);
            }
        }

        function drawDebris() {
            for(let d of debrisParticles) {
                ctx.save(); 
                ctx.globalAlpha = d.opacity;
                if(d.isZapped) {
                    ctx.fillStyle = '#f0abfc'; 
                    ctx.shadowColor = '#e879f9';
                    ctx.shadowBlur = 8; 
                } else {
                    ctx.fillStyle = CONTAMINANT_COLOR;
                }
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
                ctx.fill(); ctx.restore();
            }
        }

        function drawAlgae() {
            for(let p of algaeParticles) {
                ctx.save(); ctx.fillStyle = p.color; ctx.globalAlpha = p.opacity;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fill(); ctx.restore();
            }
        }

        function drawUVSystem() {
            const housingW = 20 * scale;
            const housingH = beaker.h * 0.7;
            const housingY = beaker.y + (beaker.h - housingH)/2;
            const diodeSize = 4 * scale;
            const spacing = 15 * scale;
            const leftX = beaker.x - beaker.w/2 - housingW;
            const rightX = beaker.x + beaker.w/2;

            ctx.fillStyle = UV_SHIELD;
            ctx.strokeStyle = GLASS_STROKE;
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            ctx.roundRect(leftX, housingY, housingW, housingH, [5*scale, 0, 0, 5*scale]);
            ctx.fill(); ctx.stroke();
            
            ctx.beginPath();
            ctx.roundRect(rightX, housingY, housingW, housingH, [0, 5*scale, 5*scale, 0]);
            ctx.fill(); ctx.stroke();

            const stripW = 4 * scale;
            const stripLeftX = leftX + housingW - stripW - (2*scale); 
            const stripRightX = rightX + (2*scale); 
            
            ctx.fillStyle = '#334155';
            ctx.fillRect(stripLeftX, housingY + 5*scale, stripW, housingH - 10*scale);
            ctx.fillRect(stripRightX, housingY + 5*scale, stripW, housingH - 10*scale);

            const diodeCount = Math.floor((housingH - 10*scale) / spacing);
            
            for(let i=0; i<diodeCount; i++) {
                const dy = housingY + 10*scale + (i * spacing);
                ctx.fillStyle = simulationRunning ? UV_DIODE_ON : UV_DIODE_OFF;
                if(simulationRunning) {
                    ctx.shadowColor = UV_DIODE_ON;
                    ctx.shadowBlur = 10;
                }
                ctx.beginPath(); ctx.arc(stripLeftX + stripW/2, dy, diodeSize/2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(stripRightX + stripW/2, dy, diodeSize/2, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                if(simulationRunning) {
                    ctx.save();
                    const isDual = currentStrain === 'hyper';
                    drawGlasswarePath(isDual);
                    ctx.clip();
                    
                    const beamGrad = ctx.createLinearGradient(stripLeftX, dy, beaker.x, dy);
                    beamGrad.addColorStop(0, UV_BEAM);
                    beamGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = beamGrad;
                    ctx.beginPath();
                    ctx.moveTo(stripLeftX + stripW, dy - 2*scale);
                    ctx.lineTo(beaker.x, dy - 15*scale); 
                    ctx.lineTo(beaker.x, dy + 15*scale);
                    ctx.lineTo(stripLeftX + stripW, dy + 2*scale);
                    ctx.fill();
                    
                    const beamGradR = ctx.createLinearGradient(stripRightX, dy, beaker.x, dy);
                    beamGradR.addColorStop(0, UV_BEAM);
                    beamGradR.addColorStop(1, 'transparent');
                    ctx.fillStyle = beamGradR;
                    ctx.beginPath();
                    ctx.moveTo(stripRightX, dy - 2*scale);
                    ctx.lineTo(beaker.x, dy - 15*scale);
                    ctx.lineTo(beaker.x, dy + 15*scale);
                    ctx.lineTo(stripRightX, dy + 2*scale);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function drawGraduations() {
            ctx.fillStyle = GLASS_STROKE;
            ctx.textAlign = 'right';
            ctx.font = getFont(10);
            const startY = beaker.y + beaker.h - (30 * scale); 
            const endY = beaker.y + (40 * scale); 
            const steps = 5;
            const stepSize = (startY - endY) / steps;
            for(let i = 0; i <= steps; i++) {
                const lineY = startY - (i * stepSize);
                const vol = 100 + (i * 100); 
                ctx.globalAlpha = 0.6;
                ctx.fillRect(beaker.x + beaker.w/2 - (25 * scale), lineY, 15 * scale, 2 * scale); 
                ctx.fillText(vol + 'ml', beaker.x + beaker.w/2 - (30 * scale), lineY + (3 * scale));
                ctx.globalAlpha = 1.0;
            }
        }

        function drawScene() {
            ctx.fillStyle = PRIMARY_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const isDual = currentStrain === 'hyper';

            ctx.save();
            drawGlasswarePath(isDual);
            ctx.clip();

            // 1. Draw Bio Tank (Left)
            const bioGrad = ctx.createLinearGradient(0, bioTank.y, 0, bioTank.y + bioTank.h);
            bioGrad.addColorStop(0, 'rgba(74, 222, 128, 0.8)'); 
            bioGrad.addColorStop(1, 'rgba(20, 83, 45, 0.95)'); 
            ctx.fillStyle = bioGrad;
            ctx.fillRect(bioTank.x - bioTank.w/2, bioTank.y, bioTank.w, bioTank.h);

            // 2. Draw Nano Tank (Right) - ONLY IF DUAL
            if(isDual) {
                const nanoGrad = ctx.createLinearGradient(0, nanoTank.y, 0, nanoTank.y + nanoTank.h);
                if(pumpActive) {
                    nanoGrad.addColorStop(0, 'rgba(34, 211, 238, 0.8)'); 
                    nanoGrad.addColorStop(1, 'rgba(8, 51, 68, 0.95)'); 
                } else {
                    nanoGrad.addColorStop(0, '#334155'); 
                    nanoGrad.addColorStop(1, '#0f172a'); 
                }
                ctx.fillStyle = nanoGrad;
                ctx.fillRect(nanoTank.x - nanoTank.w/2, nanoTank.y, nanoTank.w, nanoTank.h);
            }

            drawAlgae(); 
            
            // 3. Draw Fluid in Tubes
            ctx.fillStyle = ALGAE_COLOR;
            ctx.fillRect(tubeLeft.x - tubeLeft.w/2, beaker.y + beaker.h, tubeLeft.w, tubeLeft.h);
            
            if(isDual) {
                ctx.fillStyle = pumpActive ? 'rgba(34, 211, 238, 0.6)' : 'rgba(51, 65, 85, 0.3)';
                ctx.fillRect(tubeRight.x - tubeRight.w/2, beaker.y + beaker.h, tubeRight.w, tubeRight.h);
            }

            // 4. Draw Beaker Fluid
            const pollutionRatio = contaminantHeight / 60;
            const r = Math.round(200 - (100 * pollutionRatio));
            const g = Math.round(240 - (160 * pollutionRatio));
            const b = Math.round(255 - (195 * pollutionRatio));
            const a = 0.15 + (0.45 * pollutionRatio);
            
            const dynamicWaterColor = `rgba(${r}, ${g}, ${b}, ${a})`;
            const waterGradient = ctx.createLinearGradient(0, beaker.y + beaker.h, 0, beaker.y);
            waterGradient.addColorStop(0, dynamicWaterColor);
            waterGradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${a*0.5})`);
            
            ctx.fillStyle = waterGradient;
            ctx.fillRect(beaker.x - beaker.w/2, beaker.y, beaker.w, beaker.h);

            const currentContamH = contaminantHeight * scale; 
            ctx.fillStyle = CONTAMINANT_COLOR;
            const contaminantY = beaker.y + beaker.h - currentContamH;
            ctx.fillRect(beaker.x - beaker.w/2, contaminantY, beaker.w, currentContamH);

            drawDebris(); 
            drawNanoBubbles();
            drawBubbles();
            drawNanoBursts();
            ctx.restore();

            drawUVSystem();

            ctx.lineWidth = 4 * scale;
            ctx.strokeStyle = GLASS_STROKE;
            ctx.fillStyle = GLASS_COLOR;
            drawGlasswarePath(isDual);
            ctx.fill();
            ctx.stroke();

            // Highlights and Labels
            ctx.save();
            ctx.lineWidth = 2 * scale;
            ctx.strokeStyle = HIGHLIGHT_COLOR;
            
            ctx.beginPath();
            ctx.moveTo(beaker.x - beaker.w/2 + 15*scale, beaker.y + 30*scale);
            ctx.lineTo(beaker.x - beaker.w/2 + 15*scale, beaker.y + beaker.h - 20*scale);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(bioTank.x - bioTank.w/3, bioTank.y + bioTank.h/3, 15*scale, Math.PI, 1.5 * Math.PI);
            ctx.stroke();

            if(isDual) {
                // If Pump Active, highlight the tank
                if (pumpActive) {
                    ctx.strokeStyle = '#22d3ee';
                    ctx.shadowColor = '#22d3ee';
                    ctx.shadowBlur = 10;
                }
                ctx.beginPath();
                ctx.arc(nanoTank.x + nanoTank.w/3, nanoTank.y + nanoTank.h/3, 15*scale, 1.5 * Math.PI, 0);
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Draw PUMP connected to this tank
                drawPump();
            }
            ctx.restore();

            drawGraduations();

            ctx.fillStyle = TEXT_COLOR;
            ctx.textAlign = 'center';
            ctx.font = getFont(14);
            ctx.fillText('Reaction Chamber', beaker.x, beaker.y - 15*scale);
            
            ctx.fillStyle = ACCENT_COLOR;
            ctx.fillText('Bio-Enzyme', bioTank.x, bioTank.y + bioTank.h + 20*scale);
            
            if(isDual) {
                ctx.fillStyle = pumpActive ? '#22d3ee' : '#64748b';
                ctx.fillText('Nanobubble', nanoTank.x, nanoTank.y + nanoTank.h + 20*scale);
            }
            
            ctx.fillStyle = '#d8b4fe'; 
            ctx.font = getFont(12, 'bold');
            ctx.fillText('UV-C', beaker.x - beaker.w/2 - 40*scale, beaker.y + beaker.h/2);
            ctx.fillText('System', beaker.x + beaker.w/2 + 40*scale, beaker.y + beaker.h/2);
        }

        // --- NANOBUBBLE LOGIC START ---
        function createNanoBubble() {
            const nanoSizeMin = 0.7; 
            const nanoSizeMax = 2.0; 
            
            return {
                x: nanoTank.x - (nanoTank.w/2 - 10*scale) + Math.random() * (nanoTank.w - 20*scale),
                y: nanoTank.y + nanoTank.h - 10*scale,
                radius: (nanoSizeMin + Math.random() * (nanoSizeMax - nanoSizeMin)) * scale,
                speed: (0.4 + Math.random() * 0.6) * scale, 
                wiggleOffset: Math.random() * Math.PI * 2,
                wiggleSpeed: 0.15
            };
        }

        function updateNanoBubbles() {
            const cleaningSurfaceY = beaker.y + beaker.h - (contaminantHeight * scale);
            const tubeRightMin = tubeRight.x - tubeRight.w/2 + (2*scale);
            const tubeRightMax = tubeRight.x + tubeRight.w/2 - (2*scale);
            const tubeEntranceY = beaker.y + beaker.h + tubeRight.h;
            const tankCeilingY = nanoTank.y + (5 * scale);
            
            // Reduced cleaning contribution significantly to offset the high particle count
            const cleaningRate = strainConfig[currentStrain].cleaningRate * 0.1; 

            for (let i = nanoBubbles.length - 1; i >= 0; i--) {
                const b = nanoBubbles[i];
                let nextY = b.y - b.speed;
                let nextX = b.x + Math.sin(b.wiggleOffset) * 0.5 * scale;
                b.wiggleOffset += b.wiggleSpeed;

                // Zone 1: Tank
                if (b.y > tubeEntranceY) {
                    if (nextY < tankCeilingY) {
                         if (b.x > tubeRightMin && b.x < tubeRightMax) {
                             b.y = nextY;
                             b.x = nextX;
                         } else {
                             b.y = tankCeilingY; 
                             const slideSpeed = 1.5 * scale; 
                             if (b.x < tubeRight.x) b.x += slideSpeed;
                             else b.x -= slideSpeed;
                         }
                    } else {
                        b.y = nextY;
                        b.x = nextX;
                    }
                } 
                // Zone 2: Tube
                else if (b.y > beaker.y + beaker.h) {
                    b.y = nextY;
                    if (nextX < tubeRightMin) b.x = tubeRightMin;
                    else if (nextX > tubeRightMax) b.x = tubeRightMax;
                    else b.x = nextX;
                }
                // Zone 3: Beaker
                else {
                    b.y = nextY;
                    b.x = nextX; 
                    
                    if (b.y < beaker.y) {
                         nanoBubbles.splice(i, 1);
                    } else if (b.y <= cleaningSurfaceY) {
                        spawnMicroDebris(b.x, b.y); 
                        contaminantHeight = Math.max(5, contaminantHeight - cleaningRate); 
                        nanoBubbles.splice(i, 1); 
                    }
                }
            }
        }

        function drawNanoBubbles() {
            ctx.fillStyle = NANO_BUBBLE_COLOR;
            for (const b of nanoBubbles) {
                ctx.beginPath(); 
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); 
                ctx.fill();
            }
        }
        // --- NANOBUBBLE LOGIC END ---

        function createBubble() {
            const startInBioTank = Math.random() > 0.1; 
            let x, y;
            if (startInBioTank) {
                x = bioTank.x - (bioTank.w/2 - 10*scale) + Math.random() * (bioTank.w - 20*scale);
                y = bioTank.y + bioTank.h - 10*scale;
            } else {
                x = beaker.x;
                y = beaker.y + beaker.h + tubeLeft.h;
            }
            return {
                x: x, y: y,
                radius: (2 + Math.random() * 4) * scale,
                speed: (2 + Math.random() * 2.5) * scale, 
                bursting: false, burstTimer: 0
            };
        }

        function updateBubbles() {
            const cleaningSurfaceY = beaker.y + beaker.h - (contaminantHeight * scale);
            const tubeLeftMin = tubeLeft.x - tubeLeft.w/2 + (2*scale);
            const tubeLeftMax = tubeLeft.x + tubeLeft.w/2 - (2*scale);
            const tubeEntranceY = beaker.y + beaker.h + tubeLeft.h;
            const tankCeilingY = bioTank.y + (5 * scale);
            const cleaningRate = strainConfig[currentStrain].cleaningRate; 

            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                let nextY = b.y - b.speed;
                
                if (b.y > tubeEntranceY) {
                    if (nextY < tankCeilingY) {
                         if (b.x > tubeLeftMin && b.x < tubeLeftMax) {
                             b.y = nextY;
                         } else {
                             b.y = tankCeilingY; 
                             const slideSpeed = 2.0 * scale; 
                             if (b.x < tubeLeft.x) b.x += slideSpeed;
                             else b.x -= slideSpeed;
                         }
                    } else {
                        b.y = nextY;
                    }
                }
                else if (b.y > beaker.y + beaker.h) {
                    b.y = nextY;
                    if (b.x < tubeLeftMin) b.x = tubeLeftMin;
                    else if (b.x > tubeLeftMax) b.x = tubeLeftMax;
                }
                else {
                    b.y = nextY;
                    if (b.y < beaker.y) {
                         bubbles.splice(i, 1);
                    } else if (b.y <= cleaningSurfaceY && b.y > cleaningSurfaceY - 10*scale && !b.bursting) {
                        b.bursting = true;
                        b.burstTimer = 8;
                        contaminantHeight = Math.max(5, contaminantHeight - cleaningRate); 
                        spawnDebris(b.x, b.y);
                    }
                }

                if (b.bursting) {
                    b.burstTimer--;
                    if (b.burstTimer <= 0) bubbles.splice(i, 1);
                }
            }
            updateDebris();
            updateNanoBursts(); 
        }

        function drawBubbles() {
            for (const b of bubbles) {
                if (b.bursting) {
                    ctx.fillStyle = `rgba(255, 255, 200, ${b.burstTimer / 8})`;
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius * 3, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = BUBBLE_COLOR;
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
                }
            }
        }

        function togglePump() {
            pumpActive = !pumpActive;
            if(pumpActive) {
                nanoPumpBtn.classList.add('active');
            } else {
                nanoPumpBtn.classList.remove('active');
            }
        }

        function startExperiment() {
            currentStrain = algaeSelect.value;
            setupDiv.classList.add('hidden');
            resultsDiv.classList.add('hidden');
            runningDiv.classList.remove('hidden');
            simulationRunning = true;
            contaminantHeight = 60; 
            bubbles = [];
            nanoBubbles = []; 
            nanoBursts = [];
            debrisParticles = []; 
            pumpActive = false;
            nanoPumpBtn.classList.remove('active');
            
            // Show pump button ONLY if hyper strain
            if (currentStrain === 'hyper') {
                nanoPumpBtn.classList.remove('hidden');
            } else {
                nanoPumpBtn.classList.add('hidden');
            }

            initAlgae(); 
            updateDimensions(); // Force redraw layout based on selection

            let phaseIndex = 0;
            const totalDuration = 12000; 
            const phaseInterval = totalDuration / experimentPhases.length;
            animate();
            const phaseTimer = setInterval(() => {
                if (phaseIndex < experimentPhases.length) {
                    phaseStatus.innerHTML = experimentPhases[phaseIndex];
                    progressBar.style.width = `${((phaseIndex + 1) / experimentPhases.length) * 100}%`;
                    const config = strainConfig[currentStrain];
                    if (phaseIndex === 0) {
                        metric1Gauge.style.width = config.metric1.width;
                        metric1Value.textContent = config.metric1.text;
                    } else if (phaseIndex === 1) {
                        metric2Gauge.style.width = config.metric2.width;
                        metric2Value.textContent = config.metric2.text;
                    }
                    phaseIndex++;
                } else {
                    clearInterval(phaseTimer);
                }
            }, phaseInterval);
            setTimeout(() => {
                simulationRunning = false;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                runningDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                drawResults();
            }, totalDuration);
        }

        function animate() {
            if (!simulationRunning) return;
            const config = strainConfig[currentStrain];
            
            if (Math.random() < config.bubbleChance) { 
                 bubbles.push(createBubble());
                 if(currentStrain === 'hyper') bubbles.push(createBubble());
            }

            // Nanobubble Injection Logic - PUMP CONTROLLED
            if (currentStrain === 'hyper' && pumpActive) {
                const swarmCount = 8;
                if (Math.random() < config.nanoChance) {
                    for(let k=0; k<swarmCount; k++) {
                        nanoBubbles.push(createNanoBubble());
                    }
                }
            }

            updateNanoBubbles();
            updateBubbles();
            updateAlgae(); 
            drawScene();
            animationFrameId = requestAnimationFrame(animate);
        }
        
        function restartExperiment() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            bubbles = [];
            nanoBubbles = [];
            nanoBursts = [];
            debrisParticles = [];
            contaminantHeight = 60;
            simulationRunning = false;
            currentStrain = algaeSelect.value; // Reset view based on select
            updateDimensions(); 
            setupDiv.classList.remove('hidden');
            runningDiv.classList.add('hidden');
            resultsDiv.classList.add('hidden');
            progressBar.style.width = '0%';
            metric1Gauge.style.width = '0%';
            metric1Value.textContent = '0 U/mL';
            metric2Gauge.style.width = '0%';
            metric2Value.textContent = '0 mg/L';
            drawScene();
        }
        
        function drawResults() {
             ctx.fillStyle = PRIMARY_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const config = strainConfig[currentStrain];
            const efficiency = config.avgEfficiency; 
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const isCompact = canvas.width < 500 * scale;
            const cardW = Math.min(640 * scale, canvas.width * 0.95);
            const cardH = isCompact ? 480 * scale : 360 * scale;
            
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = GLASS_STROKE;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(centerX - cardW/2, centerY - cardH/2, cardW, cardH, 20 * scale);
            ctx.fill();
            ctx.stroke();
            
            if (isCompact) {
                const gaugeY = centerY - cardH/4; 
                const radius = 60 * scale; 
                drawGauge(centerX, gaugeY, radius, efficiency);
                const statsY = centerY + 20 * scale; 
                drawStatsText(centerX, statsY, config, true); 
            } else {
                const gaugeX = centerX - (cardW * 0.22); 
                const radius = 75 * scale;
                drawGauge(gaugeX, centerY - 20*scale, radius, efficiency);
                const statsX = centerX + (15 * scale);
                const statsY = centerY - (85 * scale); 
                drawStatsText(statsX, statsY, config, false);
            }

            ctx.font = getFont(12, 'italic');
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'center';
            ctx.fillText("Data generated from single-run simulation parameters.", centerX, centerY + cardH/2 - (20 * scale));
        }
        
        function drawGauge(x, y, r, efficiency) {
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 12 * scale; ctx.stroke();
            const startAngle = -Math.PI / 2;
            const endAngle = startAngle + (Math.PI * 2 * (efficiency / 100));
            ctx.beginPath(); ctx.arc(x, y, r, startAngle, endAngle);
            ctx.strokeStyle = ACCENT_COLOR; ctx.lineWidth = 12 * scale; ctx.lineCap = 'round'; ctx.stroke();
            ctx.fillStyle = TEXT_COLOR;
            ctx.font = getFont(42, 'bold'); ctx.textAlign = 'center';
            ctx.fillText(`${efficiency}%`, x, y + (15*scale)); 
            ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
            ctx.fillText("Contaminant Removed", x, y + r + (30*scale));
        }
        
        function drawStatsText(x, y, config, centerAlign) {
            ctx.textAlign = centerAlign ? 'center' : 'left';
            const valOffset = 145 * scale;
            
            ctx.font = getFont(20, 'bold');
            ctx.fillStyle = ACCENT_COLOR;
            ctx.fillText(currentStrain.toUpperCase() + " REPORT", x, y);
            
            ctx.fillStyle = '#334155';
            const divW = 240 * scale;
            if(centerAlign) ctx.fillRect(x - divW/2, y + 10*scale, divW, 2);
            else ctx.fillRect(x, y + 10*scale, divW, 2);
            
            const row1Y = y + 40*scale;
            const row2Y = y + 70*scale;
            const row3Y = y + 100*scale; 
            const row4Y = y + 150*scale; 
            
            if (centerAlign) {
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText(`Time: ${config.timeTaken} | Oxygen: ${config.oxygenLevel}`, x, row1Y);
                
                // DYNAMIC LABEL LOGIC
                const impactLabel = currentStrain === 'hyper' ? "Nano-Action:" : "UV-C Impact:";
                ctx.fillStyle = '#d8b4fe'; 
                ctx.fillText(impactLabel, x, row2Y);
                ctx.font = getFont(16, 'bold'); ctx.fillStyle = '#e9d5ff'; 
                // Display text value next to label or below depending on alignment preference
                // Since this is center align, we might put value on next line or same line if short
                // Let's stick to the previous pattern but adjust text
                // Actually, the previous center align block was:
                // ctx.fillText(`UV Impact: ${config.uvImpact}`, x, row2Y);
                // So I will update that:
                
                ctx.font = getFont(14); ctx.fillStyle = '#d8b4fe'; 
                ctx.fillText(`${impactLabel} ${config.uvImpact}`, x, row2Y);

                
                ctx.fillStyle = '#94a3b8';
                ctx.fillText("Bio-Efficiency Grade:", x, row3Y + 10*scale);
                
                const grade = config.grade;
                let gradeColor = ACCENT_COLOR;
                if(grade === 'C' || grade === 'D') gradeColor = '#fbbf24'; 
                ctx.font = getFont(28, 'bold'); ctx.fillStyle = gradeColor;
                ctx.fillText(grade, x, row4Y);
                
            } else {
                // Row 1: Time
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText("Processing Time:", x, row1Y);
                ctx.font = getFont(16, 'bold'); ctx.fillStyle = TEXT_COLOR;
                ctx.fillText(config.timeTaken, x + valOffset, row1Y);
                
                // Row 2: Oxygen
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText("Oxygen Saturation:", x, row2Y);
                ctx.font = getFont(16, 'bold'); ctx.fillStyle = TEXT_COLOR;
                ctx.fillText(config.oxygenLevel, x + valOffset, row2Y);
                
                // Row 3: UV / Nano Impact (DYNAMIC)
                const impactLabel = currentStrain === 'hyper' ? "Nano-Action:" : "UV-C Impact:";
                ctx.font = getFont(14); ctx.fillStyle = '#d8b4fe'; 
                ctx.fillText(impactLabel, x, row3Y);
                ctx.font = getFont(16, 'bold'); ctx.fillStyle = '#e9d5ff'; 
                ctx.fillText(config.uvImpact, x + valOffset, row3Y);
                
                // Row 4: Grade
                ctx.font = getFont(14); ctx.fillStyle = '#94a3b8';
                ctx.fillText("Bio-Efficiency Grade:", x, row4Y);
                const grade = config.grade;
                let gradeColor = ACCENT_COLOR;
                if(grade === 'C' || grade === 'D') gradeColor = '#fbbf24'; 
                ctx.font = getFont(28, 'bold'); ctx.fillStyle = gradeColor;
                ctx.fillText(grade, x + valOffset + (20*scale), row4Y + 5*scale);
            }
        }

        // Handle Setup View Visibility (Immediate Feedback)
        algaeSelect.addEventListener('change', () => {
            currentStrain = algaeSelect.value;
            // Update Scene Preview based on selection
            if(!simulationRunning) {
                updateDimensions();
                drawScene();
            }
        });

        window.addEventListener('resize', () => {
            updateDimensions();
            if(!simulationRunning) drawScene();
            if(resultsDiv.classList.contains('hidden') === false) drawResults();
        });
        
        window.onload = () => {
            updateDimensions();
            restartExperiment();
        };
    </script>
</body>
</html>
